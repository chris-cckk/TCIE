<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>華語教學英文｜默寫句子聽寫練習</title>
  <style>
    :root{
      --bg:#f7f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;
      --accent:#4f46e5;--ok:#15803d;--bad:#b91c1c;--soft:#eef2ff;--warn:#fff7ed;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{background:#fff;border-bottom:1px solid var(--line);padding:22px 18px;position:sticky;top:0;z-index:10}
    header h1{margin:0;font-size:22px}
    header p{margin:6px 0 0;color:var(--muted);font-size:14px}
    main{max-width:900px;margin:0 auto;padding:20px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px rgba(15,23,42,.04)}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .spacer{flex:1}
    button{border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:15px}
    button.secondary{background:#e5e7eb;color:#111827}
    button.ghost{background:#fff;color:var(--accent);border:1px solid #c7d2fe}
    button.danger{background:#dc2626;color:#fff}
    button:disabled{opacity:.45;cursor:not-allowed}
    input,textarea{width:100%;padding:13px 14px;border:1px solid #cfd6e2;border-radius:12px;font-size:18px;background:#fff}
    textarea{min-height:92px;resize:vertical;line-height:1.55}
    label{display:block;font-weight:700;margin:10px 0 6px}
    .small{font-size:13px;color:var(--muted)}
    .pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:#3730a3;font-size:12px;font-weight:700}
    .progress{height:10px;border-radius:999px;background:#e5e7eb;overflow:hidden;margin-top:12px}
    .bar{height:100%;background:var(--accent);width:0%}
    .translation{font-size:20px;font-weight:750;line-height:1.5;background:#f9fafb;border:1px solid var(--line);padding:14px;border-radius:12px}
    .feedback{padding:12px;border-radius:12px;margin-top:12px;line-height:1.5}
    .feedback.ok{background:#ecfdf5;color:#065f46;border:1px solid #bbf7d0}
    .feedback.bad{background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca}
    .feedback.warn{background:var(--warn);color:#7c2d12;border:1px solid #fed7aa}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;font-size:14px;vertical-align:top}
    th{background:#f9fafb}
    .hidden{display:none!important}
  </style>
</head>
<body>
<header>
  <h1>華語教學英文｜默寫句子聽寫練習</h1>
  <p>每次開始會隨機打亂句子順序。聽英文語音，看中文翻譯，逐字輸入英文句子。</p>
</header>
<main>
  <section id="startCard" class="card">
    <h2>練習說明</h2>
    <p>每題會顯示中文翻譯，並播放英文語音。學生必須逐字輸入正確英文句子，完成後再按「下一題」。</p>
    <div class="row">
      <button id="startBtn">開始聽寫</button>
      <button class="ghost" id="testVoiceBtn">測試語音</button>
    </div>
    <p class="small">語音使用瀏覽器內建 speechSynthesis。若沒有聲音，請檢查瀏覽器音量，或改用 Chrome / Edge 測試。</p>
  </section>

  <section id="practiceCard" class="card hidden">
    <div class="row">
      <span id="progressText" class="pill"></span>
      <span id="sentenceLabel" class="small"></span>
      <div class="spacer"></div>
      <button class="secondary" id="restartBtn">重新隨機開始</button>
    </div>
    <div class="progress"><div id="bar" class="bar"></div></div>

    <h2>中文翻譯</h2>
    <div id="meaning" class="translation"></div>

    <div class="row" style="margin-top:16px">
      <button id="playBtn">播放英文語音</button>
      <button class="ghost" id="slowBtn">慢速播放</button>
    </div>

    <label for="answerInput">請輸入英文句子</label>
    <textarea id="answerInput" autocomplete="off" spellcheck="false" placeholder="請在這裡逐字輸入英文句子"></textarea>

    <div class="row" style="margin-top:12px">
      <button id="nextBtn" class="hidden">下一題</button>
      <button class="secondary" id="clearBtn">清除重打</button>
    </div>

    <div id="feedback"></div>
  </section>

  <section id="resultCard" class="card hidden">
    <h2>全部完成</h2>
    <p id="resultSummary"></p>
    <div id="resultTable"></div>
    <div class="row" style="margin-top:16px">
      <button id="againBtn">再練習一次</button>
    </div>
  </section>
</main>

<script>
const sentenceData = [
  {label:"1", text:"Today we are going to learn a new grammar point.", meaning:"今天我們要學一個新的語法點。"},
  {label:"2", text:"Please look at the form and word order first.", meaning:"請先看形式／結構和語序。"},
  {label:"3", text:"This grammar pattern has a subject and a verb.", meaning:"這個語法句型有一個主語和一個動詞。"},
  {label:"4", text:"This sentence has a clear function: to compare two things.", meaning:"這個句子有一個明確的功能：比較兩個東西。"},
  {label:"5", text:"In this context, this sentence is appropriate.", meaning:"在這個語境中，這個句子是合適的。"},
  {label:"6", text:"Pay attention to this common error.", meaning:"請注意這個常見錯誤。"},
  {label:"7", text:"Don’t confuse A with B. They have different meanings.", meaning:"不要把 A 和 B 混淆。它們有不同的意思。"},
  {label:"8", text:"This word is an adverb, so we put it before the verb.", meaning:"這個詞是副詞，所以我們把它放在動詞前面。"},
  {label:"9", text:"Let’s look at an example sentence together.", meaning:"我們一起看一個例句。"},
  {label:"10", text:"Imagine this situation: your friend is not here.", meaning:"請想像這個情況：你的朋友不在這裡。"},
  {label:"11-12", text:"This character has two components: the left part is the radical, and it gives us a clue about the meaning.", meaning:"這個漢字有兩個部件：左邊是部首／偏旁，它給我們一個意思上的線索。"},
  {label:"13", text:"Look at the structure: the parts are arranged from left to right.", meaning:"請看這個結構：這些部分是從左到右排列的。"},
  {label:"14", text:"When you write this character, follow the stroke order.", meaning:"寫這個字的時候，請按照筆順。"},
  {label:"15", text:"Write the top part first, and then the bottom part.", meaning:"先寫上面的部分，再寫下面的部分。"},
  {label:"16", text:"This character has an enclosed structure.", meaning:"這是包圍結構。"},
  {label:"17", text:"Keep the parts balanced inside the frame.", meaning:"請讓各部分在框架裡保持平衡。"},
  {label:"18", text:"The stroke order starts with a horizontal stroke, then a vertical stroke.", meaning:"筆順從橫畫開始，然後是豎畫。"},
  {label:"19", text:"The radical inside gives a clue to the meaning.", meaning:"裡面的部首提供字義線索。"},
  {label:"20", text:"The radical outside suggests the pronunciation.", meaning:"外面的部首提示發音。"}
];

let order = [];
let current = 0;
let results = [];
let errorByPosition = {};
let currentAnswer = "";
let forcedLetters = 0;
let currentCompleted = false;

function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function normalizeChar(ch){ return String(ch || "").replace(/[‘’]/g,"'").replace(/[“”]/g,'"'); }
function speak(text, rate=0.88){
  if(!("speechSynthesis" in window)){
    showFeedback("bad","這個瀏覽器不支援語音播放。請改用 Chrome 或 Edge。");
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = rate;
  utterance.pitch = 1;
  window.speechSynthesis.speak(utterance);
}
function showFeedback(kind,msg){
  document.getElementById("feedback").innerHTML = `<div class="feedback ${kind}">${msg}</div>`;
}
function startPractice(){
  order = shuffle(sentenceData);
  current = 0;
  results = [];
  document.getElementById("startCard").classList.add("hidden");
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("practiceCard").classList.remove("hidden");
  renderQuestion();
}
function renderQuestion(){
  errorByPosition = {};
  currentAnswer = "";
  forcedLetters = 0;
  currentCompleted = false;
  const item = order[current];
  document.getElementById("progressText").textContent = `第 ${current+1} / ${order.length} 題`;
  document.getElementById("sentenceLabel").textContent = `原列表編號：${item.label}`;
  document.getElementById("bar").style.width = `${current/order.length*100}%`;
  document.getElementById("meaning").textContent = item.meaning;
  const input = document.getElementById("answerInput");
  input.value = "";
  input.readOnly = false;
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("feedback").innerHTML = "";
  input.focus();
  setTimeout(()=>speak(item.text),250);
}
function isAutoPunctuation(ch){
  return /[.,:;!?]/.test(ch || "") || ch === "’" || ch === "'";
}
function autoFillPunctuation(){
  const item = order[current];
  let changed = false;
  while(currentAnswer.length < item.text.length && isAutoPunctuation(item.text[currentAnswer.length])){
    currentAnswer += item.text[currentAnswer.length];
    changed = true;
  }
  if(changed){
    document.getElementById("answerInput").value = currentAnswer;
  }
}
function handleTyping(e){
  const item = order[current];
  const input = document.getElementById("answerInput");

  if(currentCompleted){
    if(e.key === "Enter"){
      e.preventDefault();
      nextQuestion();
    }
    return;
  }

  autoFillPunctuation();

  const allowedControl = ["Shift","Alt","Control","Meta","CapsLock","Tab","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End"];
  if(allowedControl.includes(e.key)) return;
  if(e.key === "Backspace"){
    e.preventDefault();
    currentAnswer = currentAnswer.slice(0,-1);
    input.value = currentAnswer;
    showFeedback("warn","已退回一個字元。請繼續輸入。");
    return;
  }
  if(e.key === "Delete"){
    e.preventDefault();
    return;
  }
  if(e.key === "Enter"){
    e.preventDefault();
    return;
  }
  if(e.key.length !== 1) return;
  e.preventDefault();

  autoFillPunctuation();
  const expected = item.text[currentAnswer.length];
  const typed = normalizeChar(e.key);

  if(isAutoPunctuation(expected)){
    autoFillPunctuation();
  }

  const nextExpected = item.text[currentAnswer.length];
  if(typed === nextExpected){
    currentAnswer += nextExpected;
    input.value = currentAnswer;
    document.getElementById("feedback").innerHTML = "";
    autoFillPunctuation();
    checkCompletion();
    return;
  }
  const pos = currentAnswer.length;
  errorByPosition[pos] = (errorByPosition[pos] || 0) + 1;
  const count = errorByPosition[pos];
  if(count >= 10){
    currentAnswer += nextExpected;
    forcedLetters++;
    input.value = currentAnswer;
    errorByPosition[pos] = 0;
    showFeedback("warn",`這個位置已錯 10 次，系統已補上正確字元：<b class="mono">${nextExpected}</b>。請繼續往下聽寫。`);
    autoFillPunctuation();
    checkCompletion();
    return;
  }
  input.value = currentAnswer;
  showFeedback("bad","這個字元不正確。");
}
function checkCompletion(){
  const item = order[current];
  if(currentAnswer === item.text){
    currentCompleted = true;
    document.getElementById("answerInput").readOnly = true;
    document.getElementById("nextBtn").classList.remove("hidden");
    const status = forcedLetters > 0 ? `完成；系統補字 ${forcedLetters} 次` : "完成";
    results.push({label:item.label, sentence:item.text, meaning:item.meaning, status});
    showFeedback("ok","正確。請按「下一題」繼續。");
  }
}
function nextQuestion(){
  current++;
  if(current >= order.length){ finish(); }
  else renderQuestion();
}
function finish(){
  document.getElementById("practiceCard").classList.add("hidden");
  document.getElementById("resultCard").classList.remove("hidden");
  const forcedCount = results.filter(r=>r.status.includes("系統補字")).length;
  document.getElementById("resultSummary").textContent = `已完成 ${results.length} 題。其中 ${forcedCount} 題曾由系統補上字元。`;
  document.getElementById("resultTable").innerHTML = `
    <table>
      <thead><tr><th>編號</th><th>中文</th><th>英文句子</th><th>狀態</th></tr></thead>
      <tbody>${results.map(r=>`<tr><td>${r.label}</td><td>${r.meaning}</td><td>${r.sentence}</td><td>${r.status}</td></tr>`).join("")}</tbody>
    </table>`;
}

document.getElementById("startBtn").onclick = startPractice;
document.getElementById("againBtn").onclick = startPractice;
document.getElementById("restartBtn").onclick = ()=>{
  if(confirm("確定要重新隨機開始嗎？目前進度會清除。")) startPractice();
};
document.getElementById("testVoiceBtn").onclick = ()=>speak("Today we are going to learn a new grammar point.");
document.getElementById("playBtn").onclick = ()=>speak(order[current].text,0.88);
document.getElementById("slowBtn").onclick = ()=>speak(order[current].text,0.68);
document.getElementById("nextBtn").onclick = nextQuestion;
document.getElementById("clearBtn").onclick = ()=>{
  if(currentCompleted) return;
  currentAnswer = "";
  errorByPosition = {};
  const input = document.getElementById("answerInput");
  input.value = "";
  input.focus();
  showFeedback("warn","已清除。請重新輸入本題。")
};
document.getElementById("answerInput").addEventListener("keydown", handleTyping);
document.getElementById("answerInput").addEventListener("paste", e=>e.preventDefault());
document.getElementById("answerInput").addEventListener("drop", e=>e.preventDefault());
</script>
</body>
</html>
